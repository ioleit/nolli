[project]
name = "nolli-review"
version = "0.9.0"
description = "Draws a pull request as a change to a repository's architecture, for you and your review agent"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "tree-sitter>=0.23",
    "tree-sitter-language-pack>=0.7",
    "pyyaml>=6",
]

[project.optional-dependencies]
# the review agent of nolli serve and nolli view ("Review structural changes"), with ANTHROPIC_API_KEY
api = ["anthropic>=2.3"]
# nolli serve with its review agent (the same as [api] for now)
serve = ["anthropic>=2.3"]

[dependency-groups]
# what running the tests needs: `uv run pytest`, or `pip install -e . --group dev` and `pytest`
dev = ["pytest"]

[project.urls]
Source = "https://github.com/ioleit/nolli"
Issues = "https://github.com/ioleit/nolli/issues"

[project.scripts]
nolli = "nolli.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

# The viewer lives in viewer/ (with its Node tooling for type checks and tests) and is
# installed as nolli.viewer: the page and its scripts (libraries come from a CDN); the server is nolli.server.
[tool.setuptools]
# Every directory with an __init__.py, listed (tests/test_packaging.py checks it).
packages = ["nolli", "nolli.logic", "nolli.model", "nolli.logic.formats", "nolli.logic.sources", "nolli.logic.transformations", "nolli.logic.transformations.projection", "nolli.logic.extractors", "nolli.logic.extractors.infra", "nolli.logic.extractors.markup",
            "nolli.logic.extractors.python",
            "nolli.logic.extractors.typescript", "nolli.review", "nolli.server", "nolli.store", "nolli.logic.formats.descriptions", "nolli.viewer"]

[tool.setuptools.package-dir]
"nolli.viewer" = "viewer"

[tool.setuptools.package-data]
"nolli" = ["skill/SKILL.md"]
"nolli.viewer" = ["*.html", "*.css", "js/*.js"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
# ruff's default rules, and:
extend-select = [
    "TID252",  # relative-imports, https://docs.astral.sh/ruff/rules/relative-imports/ (every module names the package it imports from)
    "D401",  # non-imperative-mood, https://docs.astral.sh/ruff/rules/non-imperative-mood/ (a docstring says what a function does, as PEP 257 asks)
]
ignore = [
    "SIM102",  # collapsible-if, https://docs.astral.sh/ruff/rules/collapsible-if/ (nested ifs that each say one thing)
    "TRY004",  # type-check-without-type-error, https://docs.astral.sh/ruff/rules/type-check-without-type-error/ (a bad file is a ValueError, whatever is wrong in it)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "D401",  # non-imperative-mood, https://docs.astral.sh/ruff/rules/non-imperative-mood/ (a test's docstring states what is expected, not a command)
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"
