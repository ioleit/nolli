[project]
name = "nolli-review"
version = "0.2.0"
description = "Draws a pull request as a change to a repository's architecture, for you and your review agent"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "tree-sitter>=0.23",
    "tree-sitter-language-pack>=0.7",
    "pyyaml>=6",
]

[project.urls]
Source = "https://github.com/ioleit/nolli"
Issues = "https://github.com/ioleit/nolli/issues"

[project.scripts]
nolli = "nolli.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

# The viewer lives in viewer/ (with its Node tooling for type checks and tests) and is
# installed as nolli.viewer: serve.py, the page and its scripts (libraries come from a CDN).
[tool.setuptools]
# Every directory with an __init__.py, listed (tests/test_packaging.py checks it).
packages = ["nolli", "nolli.extractors", "nolli.extractors.infra", "nolli.extractors.python",
            "nolli.extractors.typescript", "nolli.viewer"]

[tool.setuptools.package-dir]
"nolli.viewer" = "viewer"

[tool.setuptools.package-data]
"nolli" = ["skill/SKILL.md"]
"nolli.viewer" = ["*.html", "*.css", "js/*.js"]

[tool.ruff]
line-length = 110
