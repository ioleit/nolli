<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nolli</title>
<link rel="stylesheet" href="viewer.css">
<link rel="stylesheet" href="themes.css">
</head>
<body>
<aside>
  <h1>nolli</h1>
  <select id="dataset" style="width:100%"></select>
  <div id="meta" style="color:var(--muted);font-size:11px"></div>

  <section class="filter">
    <h2>Show</h2>
    <div class="sub"><span data-help="Cross-cutting things, each one box you can unfold. A hidden group is left out of the picture; the boxes that use it say so in their hover text.">Groups</span></div>
    <div id="groups" class="togs"></div>
    <div class="sub"><span data-help="Files and folders by role. A hidden role's boxes are left out, and so are their edges (counted under Residue).">Files</span><span id="rolequick" class="quick"></span></div>
    <div id="roles" class="togs"></div>
  </section>

  <h2>Detail</h2>
  <div class="row">
    <label class="opt" data-help="How many boxes the default cut may show. Changing it recomputes the default cut.">budget <input id="budget" type="number" min="4" max="300" value="28" style="width:52px"></label>
    <button id="reset" data-help="Back to the default cut for this budget.">default cut</button>
    <button id="collapse" data-help="Fold everything down to the top-level entries.">fold all</button>
  </div>
  <label class="opt row" data-help="A box with more than this many incoming edges is a utility: its incoming edges are left out, it says how many boxes use it (&ldquo;used by 7&rdquo;), sits at the bottom and has a dotted border. 0: off.">utilities above <input id="utilities" type="number" min="0" max="99" style="width:52px;margin-left:auto"> edges</label>
  <label class="opt row" data-help="Colours, fonts and box style. Kept in this browser and in the link (th=).">theme <select id="theme"></select></label>

  <h2>Residue</h2>
  <ul class="plain" id="residue"></ul>
</aside>
<main>
  <nav id="views" role="tablist">
    <button role="tab" data-view="diagram" data-help="The scene laid out (ELK.js, top to bottom) and drawn.">Diagram</button>
    <button role="tab" data-view="json" data-help="The scene the server sent, as JSON. Click an id to unfold or fold it.">JSON</button>
    <button role="tab" data-view="mermaid" data-help="The static Mermaid export written by nolli extract (default.mmd): always the default cut, ignores the controls.">Mermaid</button>
  </nav>
  <div id="stage">
    <svg id="g"><g id="root"></g></svg>
    <div id="status"></div>
    <div id="loading">loading …</div>
    <div id="tip"></div>
    <div id="rawpane"></div>
    <div id="mmdpane"></div>
  </div>
</main>
<div id="help"></div>
<section id="review"></section>
<script src="https://cdn.jsdelivr.net/npm/elkjs@0.9.3/lib/elk.bundled.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
