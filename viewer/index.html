<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nolli</title>
<link rel="stylesheet" href="viewer.css">
<link rel="stylesheet" href="themes.css">
</head>
<body>
<aside>
  <div class="navhead"><h1>nolli</h1><button id="navtoggle" class="navtoggle" aria-controls="navbody" aria-expanded="true">«</button></div>
  <div id="navbody">
  <select id="dataset" style="width:100%"></select>
  <div id="meta" style="color:var(--muted);font-size:11px"></div>

  <section class="filter">
    <h2>Show</h2>
    <div class="sub"><span data-help="Cross-cutting things, each one box you can unfold. A hidden group is left out of the picture; the boxes that use it say so in their hover text.">Groups</span></div>
    <div id="groups" class="togs"></div>
    <div class="sub"><span data-help="Files and folders by role. A hidden role's boxes are left out, and so are their edges (counted under Residue).">Files</span><span id="rolequick" class="quick"></span></div>
    <div id="roles" class="togs"></div>
  </section>

  <h2>Detail</h2>
  <div class="row" id="presets">
    <div class="seg">
      <button data-preset="default" data-help="The default cut: the most telling boxes within the budget.">default</button>
      <button data-preset="folded" data-help="Everything folded down to the top-level entries.">folded</button>
      <button data-preset="changes" hidden data-help="Every area that changed in source code unfolded: the diagram the review agent saw (review.mmd).">changes</button>
      <button data-preset="unfolded" data-help="Everything unfolded. Slow to lay out for a big repository.">unfolded</button>
    </div>
    <span id="custom" class="muted" data-help="Unfolded and folded by hand: no preset. Pick one to start over from it.">custom</span>
  </div>
  <label class="opt row" data-help="How many boxes the default cut may show. Changing it shows the default cut again.">budget <input id="budget" type="number" min="4" max="300" value="28" style="width:52px;margin-left:auto"></label>
  <label class="opt row" data-help="A box with more than this many incoming edges is a utility: its incoming edges are left out, it says how many boxes use it (&ldquo;used by 7&rdquo;), sits at the bottom and has a dotted border. 0: off.">utilities above <input id="utilities" type="number" min="0" max="99" style="width:52px;margin-left:auto"> edges</label>
  <label class="opt row" data-help="Colours, fonts and box style. Kept in this browser and in the link (th=).">theme <select id="theme"></select></label>

  <h2>Residue</h2>
  <ul class="plain" id="residue"></ul>
  </div>
</aside>
<main>
  <nav id="views" role="tablist">
    <button role="tab" data-view="interactive" data-help="The scene laid out with ELK.js and drawn, with hover cards and animation. Click a box to unfold or fold it.">Interactive</button>
    <button role="tab" data-view="mermaid" data-help="The same scene as Mermaid: text to paste into a README or a PR comment, and what a review agent reads. Laid out by Mermaid itself. Click a box to unfold or fold it.">Mermaid</button>
    <button role="tab" data-view="json" data-help="The same scene as the JSON the server sends (/api/scene). Click an id to unfold or fold it.">JSON</button>
  </nav>
  <div id="stage">
    <svg id="g"><g id="root"></g></svg>
    <div id="status"></div>
    <div id="loading">loading …</div>
    <div id="tip"></div>
    <div id="rawpane"></div>
    <div id="mmdpane"></div>
  </div>
</main>
<div id="help"></div>
<section id="review"></section>
<script src="https://cdn.jsdelivr.net/npm/elkjs@0.9.3/lib/elk.bundled.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
