# Local development corpus: repositories to extract after every change, kept outside
# this repository. Copy to dev/corpus.local.toml (gitignored) and edit the paths.

# where extracted datasets go; the viewer serves this directory with --data
data_dir = "~/data/nolli"

[[repo]]
name = "nolli"
path = "."

[[repo]]
name = "some-python-service"
path = "~/src/some-python-service"

# Pull requests (or any two commits) to review: nolli diff, written to <data_dir>/<name>.
[[diff]]
name = "some-python-service-pr12"
repo = "~/src/some-python-service"
base = "abc1234"          # the commit the PR started from
head = "def5678"          # the PR's head (or its squashed merge commit)
pr = 12                   # optional: links go to the PR's files view
title = "Add a cache in front of the store"   # optional: shown in the viewer
